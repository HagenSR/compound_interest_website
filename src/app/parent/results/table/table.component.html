<p-table #dt
  [columns]="cols"
  [value]="data$ | async | nullsafeArray"
  dataKey="simulation"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10">
  <ng-template pTemplate="caption">
    <div class="flex">
      <button type="button"
        pButton
        pRipple
        icon="pi pi-file"
        (click)="dt.exportCSV()"
        class="mr-2"
        pTooltip="CSV"
        tooltipPosition="bottom">
      </button>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      @for (col of cols; track col) {
        <th>
          <div class="col-flex">
            {{ col.header }}
            <p-sortIcon [field]="col.field"
              [pSortableColumn]="col.field">
            </p-sortIcon>
            <p-columnFilter type="text"
              [field]="col.field">
            </p-columnFilter>
          </div>
        </th>
      }
    </tr>
  </ng-template>
  <ng-template pTemplate="body"
    let-rowData
    let-columns="columns">
    <tr [pSelectableRow]="rowData">
      @for (col of columns; track col) {
        <td
          >
          @switch (col.pipeName) {
            @case ('currency') {
              {{rowData[col.field] | currency}}
            }
            @case ('percent') {
              {{rowData[col.field] / 100 | percent}}
            }
            @default {
              {{rowData[col.field]}}
            }
          }
        </td>
      }
    </tr>
  </ng-template>
</p-table>
