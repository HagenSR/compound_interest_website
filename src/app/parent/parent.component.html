<div class="flex-col">
  <app-settings></app-settings>

  @for (sim of (sims$ | async); track sim; let i = $index) {
    <app-simulation [simulation]="sim"
      [index]="i"
      class="padding-bottom-5"
      [attr.data-cy]="'simulation-' + i">
    </app-simulation>
  }

  <app-results></app-results>
</div>
