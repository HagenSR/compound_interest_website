server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Never cache the service worker itself so updates roll out immediately
    location = /compound-interest-website/ngsw-worker.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Long-lived cache for hashed assets (JS, CSS)
    location ~* /compound-interest-website/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular app — fall back to index.html for client-side routing
    location /compound-interest-website/ {
        try_files $uri $uri/ /compound-interest-website/index.html;
    }

    # Redirect bare path (no trailing slash) to canonical URL
    location = /compound-interest-website {
        return 301 /compound-interest-website/;
    }
}
